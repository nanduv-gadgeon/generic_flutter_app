targets:
  $default:
    builders:
      drift_dev:
        options:
          # Used by `dart run drift_dev make-migrations` to snapshot the schema and
          # generate migration tests. Run it after every schemaVersion bump.
          databases:
            app_database: lib/data/db/app_database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
